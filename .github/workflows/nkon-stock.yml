name: NKON stock monitor

on:
  schedule:
    - cron: '0,15,30,45 * * * *'   # every 15 minutes
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        type: choice
        options:
          - monitor
          - check-only
          - simulate-stock
        default: check-only

permissions:
  contents: write   # needed to persist .monitor/stock_*.txt via cache

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MODE: ${{ inputs.mode || 'monitor' }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore stock state
        if: env.MODE == 'monitor'
        uses: actions/cache/restore@v4
        with:
          path: .monitor/
          key: nkon-stock-v1-${{ github.run_id }}
          restore-keys: nkon-stock-v1-

      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PROXY_URL:          ${{ secrets.PROXY_URL }}
        run: |
          case "$MODE" in
            monitor)        python stock_monitor.py ;;
            check-only)     python stock_monitor.py --check-only ;;
            simulate-stock) python stock_monitor.py --simulate-stock ;;
          esac

      - name: Save stock state
        if: env.MODE == 'monitor'
        uses: actions/cache/save@v4
        with:
          path: .monitor/
          key: nkon-stock-v1-${{ github.run_id }}
