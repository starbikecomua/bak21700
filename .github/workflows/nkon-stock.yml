name: NKON stock monitor

on:
  schedule:
    - cron: '0,15,30,45 * * * *'   # every 15 minutes
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        type: choice
        options:
          - monitor
          - check-only
          - simulate-stock
        default: check-only

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MODE: ${{ inputs.mode || 'monitor' }}

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Camoufox browser binary
        uses: actions/cache@v4.2.2
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-0.5.9

      - name: Download Camoufox browser binary
        run: python -m camoufox fetch

      - name: Install Firefox system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libdbus-glib-1-2 libx11-xcb1 \
            libxtst6 libxrandr2 libxcomposite1 libxdamage1 libxfixes3 \
            libxi6 libasound2t64 libgbm1 libnss3 libxkbcommon0 xvfb

      - name: Restore stock state
        if: env.MODE == 'monitor'
        uses: actions/cache/restore@v4.2.2
        with:
          path: .monitor/
          key: nkon-stock-v1-${{ github.run_id }}
          restore-keys: nkon-stock-v1-

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PROXY_URL:          ${{ secrets.PROXY_URL }}
        run: |
          case "$MODE" in
            monitor)        python stock_monitor.py ;;
            check-only)     python stock_monitor.py --check-only ;;
            simulate-stock) python stock_monitor.py --simulate-stock ;;
          esac

      - name: Save stock state
        if: env.MODE == 'monitor'
        uses: actions/cache/save@v4.2.2
        with:
          path: .monitor/
          key: nkon-stock-v1-${{ github.run_id }}
